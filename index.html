<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig</title>
    <link rel="stylesheet" href="sass/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <section>
      <div class="container">
        <div class="row">
          <!-- COLONNE PLAYER 1 -->
          <div class="player">
            <div>
              <h2>Player 1</h2>
              <div id="scoreP1" class="score">43</div>
            </div>

            <div class="current">
              <p>current</p>
              <h3 id="currentP1">11</h3>
            </div>
          </div>
          <!-- COLONNE DÉ -->
          <div class="colD">
            <div class="actionColD">
              <button id="restart" type="button">
                <i class="bi bi-plus-circle"></i>
              </button>
              <h4>new game</h4>
            </div>
            <div id="dice" class="dice">
              <i class="bi bi-dice-1"></i>
            </div>
            <div class="actionColD">
              <button id="rollDice" type="button">
                <i class="bi bi-arrow-repeat"></i>
              </button>
              <h4>roll dice</h4>
            </div>
            <div class="actionColD">
              <button id="hold" type="button">
                <i class="bi bi-save2"></i>
              </button>
              <h4>hold</h4>
            </div>
          </div>
          <!-- COLONNE PLAYER 2 -->

          <div class="player">
            <div>
              <h2>Player 2</h2>
              <div id="scoreP2" class="score">43</div>
            </div>

            <div class="current">
              <p>current</p>
              <h3 id="currentP2">21</h3>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- LANCE DE DE -->

    <script>
      const rollBtn = document.getElementById("rollDice");
      const de = document.getElementById("dice");
      let scoreP1 = document.getElementById("currentP1");
      let scoreGlobalP1 = document.getElementById("scoreP1");
      let scoreP2 = document.getElementById("currentP2");
      let scoreGlobalP2 = document.getElementById("scoreP2");
      /* MODELES */
      /* 1 */
      class Player {
        constructor(num) {
          this.num = num;
          this.score = 0;
          this.globalScore = 0;
        }
      }
      /* 2 */
      class Jeu {
        constructor() {
          this.player1 = new Player(1);
          this.player2 = new Player(2);
          this.playerNow = this.player1;
        }

        lacerDe() {
          const roll = Math.floor(Math.random() * 6) + 1;

          if (roll === 1) {
            this.playerNow.score = 0;
            this.changerJoueur();
          } else {
            this.playerNow.score += roll;
          }
          return roll;
        }

        hold() {
          this.playerNow.globalScore += this.playerNow.score;
          this.playerNow.score = 0;
          this.changerJoueur();
        }

        changerJoueur() {
          if (this.playerNow === this.player1) {
            this.playerNow = this.player2;
          } else {
            this.playerNow = this.player1;
          }
        }
      }

      /* rollBtn.addEventListener("click", () => {
        const roll = Math.floor(Math.random() * 6) + 1;
        de.innerHTML = `<i class="bi bi-dice-${roll}"></i>`;
      }); */
    </script>
  </body>
</html>
