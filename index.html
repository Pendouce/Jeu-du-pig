<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig</title>
    <link rel="stylesheet" href="sass/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <section>
      <div class="container">
        <div id="row" class="row">
          <!-- COLONNE PLAYER 1 -->
          <div id="player1" class="player">
            <div>
              <h2>Player 1</h2>
              <div id="scoreP1" class="score">0</div>
            </div>

            <div class="current">
              <p>current</p>
              <h3 id="currentP1">0</h3>
            </div>
          </div>
          <!-- COLONNE DÉ -->
          <div class="colD">
            <div class="actionColD">
              <button id="restart" type="button">
                <i class="bi bi-plus-circle"></i>
              </button>
              <h4>new game</h4>
            </div>
            <div id="dice" class="dice">
              <i class="bi bi-dice-1"></i>
            </div>
            <div class="actionColD">
              <button id="rollDice" type="button">
                <i class="bi bi-arrow-repeat"></i>
              </button>
              <h4>roll dice</h4>
            </div>
            <div class="actionColD">
              <button id="hold" type="button">
                <i class="bi bi-save2"></i>
              </button>
              <h4>hold</h4>
            </div>
          </div>
          <!-- COLONNE PLAYER 2 -->

          <div id="player2" class="player">
            <div>
              <h2>Player 2</h2>
              <div id="scoreP2" class="score">0</div>
            </div>

            <div class="current">
              <p>current</p>
              <h3 id="currentP2">0</h3>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- LANCE DE DE -->

    <script>
      const rollBtn = document.getElementById("rollDice");
      const holdBtn = document.getElementById("hold");
      const restartBtn = document.getElementById("restart");
      const dice = document.getElementById("dice");
      /* MODELES */
      /* 1 */
      class Player {
        constructor(num) {
          this.num = num;
          this.score = 0;
          this.globalScore = 0;
        }
      }
      /* 2 */
      class Jeu {
        constructor() {
          this.player1 = new Player(1);
          this.player2 = new Player(2);
          this.playerNow = this.player1;
        }

        lancerDe() {
          const roll = Math.floor(Math.random() * 6) + 1;
          if (roll === 1) {
            this.playerNow.score = 0;
            this.changerJoueur();
          } else {
            this.playerNow.score += roll;
          }
          return roll;
        }

        hold() {
          this.playerNow.globalScore += this.playerNow.score;
          this.playerNow.score = 0;
          this.changerJoueur();
        }

        restart() {
          this.player1.score = 0;
          this.player1.globalScore = 0;
          this.player2.score = 0;
          this.player2.globalScore = 0;
          this.playerNow = this.player1;
        }

        changerJoueur() {
          if (this.playerNow === this.player1) {
            this.playerNow = this.player2;
          } else {
            this.playerNow = this.player1;
          }
        }
      }

      /* CONTROLLER */
      class JeuController {
        constructor() {
          this.model = new Jeu();
          this.vue = new VueJeu(this.model);
        }
        controllLancerDe() {
          rollBtn.addEventListener("click", () => {
            const roll = this.model.lancerDe();
            this.vue.majDe(roll);
            this.vue.majScore();
            this.vue.playerActif();
          });
        }
        controllHold() {
          holdBtn.addEventListener("click", () => {
            this.model.hold();
            this.vue.majScore();
          });
        }
        controllRestart() {
          restartBtn.addEventListener("click", () => {
            this.model.restart();
            this.vue.majScore();
            this.vue.majDe(1);
            this.vue.playerActif();
          });
        }
      }
      document.addEventListener("DOMContentLoaded", () => {
        const controller = new JeuController();
        controller.controllLancerDe();
        controller.controllHold();
        controller.controllRestart();
      });

      /* VUE */

      class VueJeu {
        constructor(model) {
          this.model = model;

          this.scoreP1 = document.getElementById("currentP1");
          this.scoreGlobalP1 = document.getElementById("scoreP1");
          this.scoreP2 = document.getElementById("currentP2");
          this.scoreGlobalP2 = document.getElementById("scoreP2");
          this.de = document.getElementById("dice");
          this.row = document.getElementById("row");

          this.player1 = document.getElementById("player1");
          this.player2 = document.getElementById("player2");
        }
        playerActif() {
          //const row = this.row;
          this.row.style.background =
            this.model.playerNow.num === 1
              ? "linear-gradient(to right, #f0f0f0 50%, white 50%)"
              : "linear-gradient(to right, white 50%, #f0f0f0 50%)";
        }

        majDe(roll) {
          this.de.classList.remove("roll");
          void this.de.offsetWidth;
          // force le reflow (pour relancer l'animation)
          // relance l'animation
          this.de.classList.add("roll");
        }

        majScore() {
          this.scoreP1.textContent = this.model.player1.score;
          this.scoreP2.textContent = this.model.player2.score;
          this.scoreGlobalP1.textContent = this.model.player1.globalScore;
          this.scoreGlobalP2.textContent = this.model.player2.globalScore;
        }
      }
      /* rollBtn.addEventListener("click", () => {
        const roll = Math.floor(Math.random() * 6) + 1;
        de.innerHTML = `<i class="bi bi-dice-${roll}"></i>`;
      }); */
    </script>
  </body>
</html>
